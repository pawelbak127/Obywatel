name: Import danych

# DLACZEGO TU, A NIE NA VERCELU
# Backfill glosowan to ~4 200 zapytan do Sejm API i ~1,9 mln wierszy w bazie
# (zmierzone sondami). Limit czasu funkcji na darmowym planie Vercela liczy sie
# w sekundach, wiec cron musi mieszkac tutaj.
#
# Efekt uboczny, ktory jest nam na reke: codzienne zapytanie do Supabase
# utrzymuje darmowa baze w stanie aktywnym.

on:
  schedule:
    # 03:15 UTC. Celowo nie o rownej godzinie — o pelnych godzinach kolejka
    # GitHuba jest najbardziej obciazona i start potrafi sie opoznic.
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Ktore zadanie uruchomic'
        required: true
        default: 'all'
        type: choice
        options:
          - all                # poslowie + glosowania + procesy + zdjecia
          - sync-mps           # sami poslowie i kluby
          - sync-votings       # glosowania przyrostowo
          - sync-processes     # procesy legislacyjne i ich etapy
          - sync-photos        # kopiowanie brakujacych zdjec do Storage
          - backfill-votings   # PELNY import kadencji (dlugi!)

concurrency:
  group: ingest
  cancel-in-progress: false # nigdy nie przerywamy trwajacego importu w polowie

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Backfill potrafi trwac kilkanascie minut; reszta to sekundy.
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Kontakt w User-Agent to elementarna uprzejmosc wobec serwera Kancelarii Sejmu.
      INGEST_USER_AGENT: ${{ vars.INGEST_USER_AGENT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kontrola sekretow
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"  || { echo "::error::Brak sekretu NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Brak sekretu SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Poslowie i kluby
        if: ${{ inputs.job == 'sync-mps' || inputs.job == 'all' || github.event_name == 'schedule' }}
        run: npx tsx ingest/jobs/sync-mps.ts

      - name: Glosowania (przyrostowo)
        if: ${{ inputs.job == 'sync-votings' || inputs.job == 'all' || github.event_name == 'schedule' }}
        run: npx tsx ingest/jobs/sync-votings.ts

      # PROCESY LEGISLACYJNE — codziennie, po glosowaniach.
      #
      # KOLEJNOSC NIE JEST DOWOLNA. Etap procesu niesie surowe wspolrzedne
      # glosowania (posiedzenie + numer), ale `voting_id` domyka sie tylko
      # wtedy, gdy to glosowanie jest juz w bazie. Uruchomiony PRZED importem
      # glosowan zostawilby nowe etapy bez powiazania — i blok "czego dotyczylo
      # glosowanie" nie pojawilby sie na profilu posla.
      #
      # DLACZEGO CODZIENNIE, A NIE RAZ W TYGODNIU. Pelny przebieg to ~1 670
      # zapytan i okolo trzech minut przy CONCURRENCY=8. Rozwazalismy tygodniowy
      # harmonogram "z uprzejmosci wobec serwera Kancelarii", ale to bylo zle
      # wywazone: do dnia 11.09.2026 KAZDY czytelnik wchodzacy na /poslowie
      # generowal 60 zadan do tego samego serwera po zdjecia posłow. Trzy minuty
      # ruchu na dobe z jednego runnera to ulamek tego, co wlasnie przestalismy
      # robic — a dane sa swiezsze o szesc dni.
      - name: Procesy legislacyjne
        if: ${{ inputs.job == 'sync-processes' || inputs.job == 'all' || github.event_name == 'schedule' }}
        run: npx tsx ingest/jobs/sync-processes.ts

      # ZDJECIA — dokopiowanie brakujacych ORAZ odswiezenie 17 najstarszych
      # kopii (P0-4, migracja 0027). Odswiezanie jest domyslne i NIE wymaga
      # tu zadnej flagi — celowo, bo flaga oznaczalaby, ze o rotacji trzeba
      # pamietac w dwoch plikach naraz, a zapomnienie nie daloby sygnalu.
      #
      # Koszt ZMIERZONY 12.09.2026 na pelnej porcji: 17 zdjec w 8,9 s.
      # Plan zakladal ~35 s; realnie jest czterokrotnie taniej, bo pobranie
      # trwa ulamek sekundy, a nie dwie. Kazde z 499 zdjec wraca raz na
      # okolo 30 dni.
      # Musi isc PO sync-mps, ktory ustawia photo_exists.
      # DNI POSIEDZEN — 499 zapytan, jedno na posla. Musi isc PO sync-mps
      # (klucz obcy do `mps`) i po sync-votings, zeby liczby na profilu
      # pochodzily z tego samego przebiegu.
      - name: Dni posiedzen i usprawiedliwienia
        if: ${{ inputs.job == 'sync-days' || inputs.job == 'all' || github.event_name == 'schedule' }}
        run: npx tsx ingest/jobs/sync-sitting-days.ts

      # KOMISJE — jedno zadanie i 40 rekordow. Musi isc PO sync-mps, bo
      # `committee_members` ma klucz obcy do `mps`.
      - name: Komisje sejmowe
        if: ${{ inputs.job == 'committees' || inputs.job == 'all' || github.event_name == 'schedule' }}
        run: npx tsx ingest/jobs/sync-committees.ts

      # ZNAKI KLUBOW — trzynascie plikow, wiec caly zbior miesci sie w jednym
      # przebiegu. Musi isc PO sync-mps, ktory tworzy wiersze w `clubs`.
      # Zapis do Storage nastepuje wylacznie przy realnej roznicy sumy.
      - name: Znaki klubow do Storage
        if: ${{ inputs.job == 'sync-logos' || inputs.job == 'all' || github.event_name == 'schedule' }}
        run: npx tsx ingest/jobs/sync-club-logos.ts

      # INTERPELACJE I ZAPYTANIA — kilka duzych zadan listy, bez zapytan
      # na posla (w odroznieniu od dni posiedzen). Musi isc PO sync-mps:
      # autor spoza `mps` jest tylko RAPORTOWANY (§7.2), ale bez importu
      # poslow kazde powiazanie autor-dokument zostaloby pominiete.
      - name: Interpelacje i zapytania poselskie
        if: ${{ inputs.job == 'interpellations' || inputs.job == 'all' || github.event_name == 'schedule' }}
        run: npx tsx ingest/jobs/sync-interpellations.ts

      - name: Zdjecia poslow do Storage
        if: ${{ inputs.job == 'sync-photos' || inputs.job == 'all' || github.event_name == 'schedule' }}
        run: npx tsx ingest/jobs/sync-mp-photos.ts

      # Uruchamiane WYLACZNIE recznie. Kursor w sync_state sprawia, ze przerwany
      # backfill wznawia sie od nastepnego posiedzenia, a nie od poczatku.
      - name: Backfill calej kadencji
        if: ${{ inputs.job == 'backfill-votings' }}
        run: npx tsx ingest/jobs/backfill-votings.ts
